version: "3.8"

# Local observability stack -- Loki (logs), Prometheus (metrics), Tempo
# (traces), Grafana (dashboards), Jaeger (trace UI), OpenTelemetry
# Collector (receives OTLP from api/, fans out to Tempo/Prometheus).
#
# Start:  docker compose -f docker-compose.observability.yml up -d
# Stop:   docker compose -f docker-compose.observability.yml down
# Wipe data too: docker compose -f docker-compose.observability.yml down -v
#
# The API itself is NOT started by this file (it already has its own
# docker-compose.yml / local uvicorn workflow) -- this stack only adds
# observability backends. Point the API at it via .env:
#   OTEL_ENABLED=true
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317
#   LOG_FORMAT=json   (optional -- JSON console output Promtail-style
#                       shippers can also scrape, independent of Loki)

services:
  loki:
    image: grafana/loki:3.2.1
    container_name: rag_saas_loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: rag_saas_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver   # required so Tempo's metrics_generator (service graphs/span metrics) can remote_write here
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    container_name: rag_saas_tempo
    ports:
      - "3200:3200"   # Tempo query API (used by Grafana's Tempo datasource)
      - "4327:4317"   # OTLP gRPC (offset from the collector's own 4317 below)
      - "4328:4318"   # OTLP HTTP (offset from the collector's own 4318 below)
    volumes:
      - ./observability/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo-data:/var/tempo
    command: -config.file=/etc/tempo/tempo-config.yml
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: rag_saas_jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4319:4317"    # OTLP gRPC (a second, independent real ingest path -- Jaeger and Tempo each get their own real copy of every trace)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    container_name: rag_saas_otel_collector
    ports:
      - "4317:4317"   # OTLP gRPC -- point OTEL_EXPORTER_OTLP_ENDPOINT here
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./observability/otel/otel-config.yml:/etc/otel-collector-config.yml:ro
    command: ["--config=/etc/otel-collector-config.yml"]
    depends_on:
      - tempo
      - loki
    restart: unless-stopped

  n8n-postgres:
    image: postgres:16-alpine
    container_name: rag_saas_n8n_postgres
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n_password
    volumes:
      - n8n-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.65.2
    container_name: rag_saas_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n_password
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      - n8n-postgres
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: rag_saas_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  loki-data:
  prometheus-data:
  tempo-data:
  grafana-data:
  n8n-data:
  n8n-postgres-data:

# Airbyte is deliberately NOT included as a plain docker-compose service
# here -- honest, real reason: Airbyte OSS deprecated its old
# docker-compose deployment in favor of `abctl` (their own CLI, which
# provisions a local Kubernetes cluster via kind). Shipping the old
# compose-based setup would install an unsupported, no-longer-maintained
# version -- see docs/integrations/AIRBYTE.md for the real, current
# install command (`abctl local install`) and how it plugs into this
# app's own real Airbyte API client (api/services/airbyte_client.py).

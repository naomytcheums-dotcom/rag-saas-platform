name: CI

# Real gap found via audit (2026-09-19): 284 test files existed in
# tests/ but nothing ever ran them automatically -- a regression could
# be merged without a single test executing. This workflow is the fix:
# every push and pull request against main runs the full backend test
# suite (SQLite in-memory, no real Postgres needed -- see
# tests/conftest.py's own docstring), a Python dependency vulnerability
# scan, and the frontend's type check, lint, unit tests, and dependency
# vulnerability scan.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # Real bug found by this étape's own first-ever completed CI run:
    # this job was cancelled at the original 15-minute limit while
    # still making genuine, steady progress (42% through 4756 real
    # tests, not stuck) -- a shared GitHub-hosted runner is real, but
    # slower per-test than this session's own dev machine (real bcrypt
    # hashing costs, real async DB round-trips, add up differently under
    # shared CPU). 30 minutes leaves real headroom without masking an
    # actual hang if one ever occurs.
    timeout-minutes: 30
    # Phase 5, Étape 11 -- real fix for the ~15 auth/SSO test failures
    # traced in ROADMAP.md (Étape 10): a real Redis service for THIS
    # job specifically, so RATE_LIMIT_REDIS_URL points at something
    # actually reachable from this runner instead of the shared
    # secret's own real remote instance (unreachable from a GitHub-
    # hosted runner, or reachable but carrying real state from a
    # previous run -- either way, not what a fast, isolated test run
    # needs).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-api.txt

      - name: Run test suite
        env:
          # Same secrets already configured for the Celery worker
          # workflow (.github/workflows/celery-worker.yml) -- the test
          # suite itself runs against an in-memory SQLite DB, not
          # DATABASE_URL, but every required (no-default) setting must
          # still resolve for api.config.settings to import at all.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CELERY_BROKER_URL: ${{ secrets.CELERY_BROKER_URL }}
          CELERY_RESULT_BACKEND: ${{ secrets.CELERY_RESULT_BACKEND }}
          # Real, deliberate override of the shared secret above: THIS
          # job's own real, isolated Redis service, not whatever
          # RATE_LIMIT_REDIS_URL's own secret value points to.
          RATE_LIMIT_REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          SESSION_MIDDLEWARE_SECRET: ${{ secrets.SESSION_MIDDLEWARE_SECRET }}
          AUDIT_LOG_HMAC_SECRET_KEY: ${{ secrets.AUDIT_LOG_HMAC_SECRET_KEY }}
          SECRET_ENCRYPTION_KEY: ${{ secrets.SECRET_ENCRYPTION_KEY }}
          ENCRYPTION_MASTER_KEY: ${{ secrets.ENCRYPTION_MASTER_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
          S3_DOCUMENTS_BUCKET_NAME: ${{ secrets.S3_DOCUMENTS_BUCKET_NAME }}
        # Real bug found by this étape's own first-ever completed CI run
        # (GitHub Actions never got this far before -- see ROADMAP.md's
        # own Étape 7 entry on the account-wide billing block): 7 test
        # files fail collection here, all for the same real reason --
        # they test the LEGACY `src/`/`dashboard/` prototype
        # (docs/architecture/LEGACY.md), which needs `requirements.txt`
        # (anthropic/chromadb/streamlit/googleapiclient), never installed
        # by this job's own `requirements-api.txt`-only install step.
        # `.circleci/config.yml`'s own real, already-working job list
        # confirms this exact same exclusion is the established
        # precedent, not a new one invented here.
        run: pytest -q --maxfail=20 --ignore=sdks/python/tests/test_client.py --ignore=tests/test_agent.py --ignore=tests/test_injection_test_set.py --ignore=tests/test_integrations.py --ignore=tests/test_regression.py --ignore=tests/test_voice.py --ignore=tests_pipeline/test_retrieval.py

  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-api.txt

      - name: pip-audit
        run: pip-audit -r requirements-api.txt --desc off

  build-backend:
    # Phase 5, Étape 10 -- real Docker build verification (P0, carried
    # over from Étapes 7/9: local builds in this session's own dev
    # environment kept failing on unrelated packages each time --
    # bcrypt, then torch, then ddtrace, then a bare ReadTimeoutError on
    # the very first dependency -- with every "missing" package
    # independently confirmed to exist and install fine locally,
    # pointing at local network instability, not a real code defect. A
    # GitHub-hosted runner is a genuinely different, stable network path
    # this session's own environment can't rule out or confirm from the
    # inside.
    #
    # Deliberately NOT `needs: backend-tests` -- a real, environment-
    # specific test-suite issue (auth/session tests failing only on this
    # runner, not locally, likely a missing real Redis reachable at
    # RATE_LIMIT_REDIS_URL for this job -- see ROADMAP.md) is a genuinely
    # separate concern from "does this Dockerfile actually build,"
    # which this job exists specifically to verify without being
    # blocked by an unrelated, already-traced issue.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: rag-saas-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    needs: frontend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: rag-saas-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate route types
        # Real bug found on this étape's own first real CI run (Phase 5,
        # Étape 10): `app/layout.tsx` uses Next.js's own typed-routes
        # `LayoutProps<"/">` global type, which only exists once Next.js
        # has actually generated it (normally a side effect of `next
        # dev`/`next build`, which a real local dev machine has usually
        # already run at least once -- a fresh CI checkout never has).
        # `next typegen` generates just that, without a full build.
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: npm audit
        run: npm audit --production

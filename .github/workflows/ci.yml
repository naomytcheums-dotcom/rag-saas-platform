name: CI

# Real gap found via audit (2026-09-19): 284 test files existed in
# tests/ but nothing ever ran them automatically -- a regression could
# be merged without a single test executing. This workflow is the fix:
# every push and pull request against main runs the full backend test
# suite (SQLite in-memory, no real Postgres needed -- see
# tests/conftest.py's own docstring), a Python dependency vulnerability
# scan, and the frontend's type check, lint, unit tests, and dependency
# vulnerability scan.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # Real bug found by this étape's own first-ever completed CI run:
    # this job was cancelled at the original 15-minute limit while
    # still making genuine, steady progress (42% through 4756 real
    # tests, not stuck) -- a shared GitHub-hosted runner is real, but
    # slower per-test than this session's own dev machine (real bcrypt
    # hashing costs, real async DB round-trips, add up differently under
    # shared CPU). Measured again on PR #20 and on main: the suite is now bigger and the job is cancelled at 30 minutes with pytest
    # still running, at about 61% after 27 minutes (so ~45 minutes in total on a standard runner). 75 minutes leaves headroom
    # without masking an actual hang. tests/test_ci_backend_timeout.py guards this limit.
    timeout-minutes: 75
    # Phase 5, Étape 11 -- real fix for the ~15 auth/SSO test failures
    # traced in ROADMAP.md (Étape 10): a real Redis service for THIS
    # job specifically, so RATE_LIMIT_REDIS_URL points at something
    # actually reachable from this runner instead of the shared
    # secret's own real remote instance (unreachable from a GitHub-
    # hosted runner, or reachable but carrying real state from a
    # previous run -- either way, not what a fast, isolated test run
    # needs).
    services:
      # Disposable database for THIS job only. Until 2026-10-10 this job used the repository secret DATABASE_URL, i.e. the real database, and its
      # integration tests (JWT key rotation, PostgreSQL concurrency, admin dashboard) read and DELETED rows there. Never again: see tests/conftest.py,
      # which now refuses to run against a remote database or service.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-api.txt -r requirements-optional.txt

      - name: Lint (runtime-error rules)
        run: pip install --no-cache-dir ruff && ruff check api/

      - name: Apply the migrations to the disposable database
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/rag_saas_test
          JWT_SECRET_KEY: ci-only-jwt-secret-key-never-used-outside-ci-32c
          SESSION_MIDDLEWARE_SECRET: ci-only-session-secret-never-used-outside-ci-32c
          AUDIT_LOG_HMAC_SECRET_KEY: ci-only-audit-log-hmac-key-never-used-outside-ci-32c
          SUPPORT_EMAIL: support@ci-test.invalid
          EMAIL_FROM_ADDRESS: onboarding@resend.dev
          RESEND_API_KEY: re_ci_placeholder_never_a_real_key
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          RATE_LIMIT_REDIS_URL: redis://localhost:6379/2
        run: python -m alembic upgrade head

      - name: Run test suite
        env:
          # Real root cause found (Phase 5, Étape 12) for the ~15
          # auth/SSO failures traced across Étapes 10-11 -- NOT Redis
          # (that hypothesis was tested and disproven). `COOKIE_SECURE`
          # defaults to `True` (api/config.py) and was never overridden
          # here, unlike every local dev machine's own git-ignored
          # `.env` (`COOKIE_SECURE=False`, confirmed present locally).
          # tests/conftest.py's own test client talks to the app over
          # plain `http://testserver` (ASGITransport, never real TLS) --
          # with `COOKIE_SECURE=True`, every `Secure`-flagged cookie
          # (refresh_token/csrf_token) is silently dropped by httpx's
          # own cookie jar, breaking every session/CSRF-dependent
          # assertion. Reproduced locally and confirmed byte-for-byte
          # (`COOKIE_SECURE=True pytest tests/test_auth_api.py`: same 15
          # failures, same exact assertions) BEFORE touching CI, per
          # this étape's own "one real CI run, not a guessing loop" rule.
          COOKIE_SECURE: "False"
          # Placeholder OAuth client settings, the same fake values .circleci/config.yml already uses: the OAuth clients are registered at
          # import time, and without them /auth/oauth/<provider>/authorize answers 503. Never real credentials.
          GOOGLE_OAUTH_CLIENT_ID: ci-only-google-client-id-never-real
          GOOGLE_OAUTH_CLIENT_SECRET: ci-only-google-client-secret-never-real
          GITHUB_OAUTH_CLIENT_ID: ci-only-github-client-id-never-real
          GITHUB_OAUTH_CLIENT_SECRET: ci-only-github-client-secret-never-real
          # Same secrets already configured for the Celery worker
          # workflow (.github/workflows/celery-worker.yml) -- the test
          # suite itself runs against an in-memory SQLite DB, not
          # DATABASE_URL, but every required (no-default) setting must
          # still resolve for api.config.settings to import at all.
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/rag_saas_test
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          # Real, deliberate override of the shared secret above: THIS
          # job's own real, isolated Redis service, not whatever
          # RATE_LIMIT_REDIS_URL's own secret value points to.
          RATE_LIMIT_REDIS_URL: redis://localhost:6379/2
          JWT_SECRET_KEY: ci-only-jwt-secret-key-never-used-outside-ci-32c
          SESSION_MIDDLEWARE_SECRET: ci-only-session-secret-never-used-outside-ci-32c
          AUDIT_LOG_HMAC_SECRET_KEY: ci-only-audit-log-hmac-key-never-used-outside-ci-32c
          SECRET_ENCRYPTION_KEY: ci-only-secret-encryption-key-never-used-outside-ci-32c
          ENCRYPTION_MASTER_KEY: gBZ-pfccwD20XSBiesnRCAo9e7_y7E0LOAAvsXGJXyg=
          RESEND_API_KEY: re_ci_placeholder_never_a_real_key
          EMAIL_FROM_ADDRESS: onboarding@resend.dev
          SUPPORT_EMAIL: support@ci-test.invalid
          S3_ENDPOINT_URL: http://localhost:9000
          S3_BUCKET_NAME: avatars
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_REGION: us-east-1
          S3_PUBLIC_BASE_URL: http://localhost:9000/public/avatars
          S3_DOCUMENTS_BUCKET_NAME: documents
        # Real bug found by this étape's own first-ever completed CI run
        # (GitHub Actions never got this far before -- see ROADMAP.md's
        # own Étape 7 entry on the account-wide billing block): 7 test
        # files fail collection here, all for the same real reason --
        # they test the LEGACY `src/`/`dashboard/` prototype
        # (docs/architecture/LEGACY.md), which needs `requirements.txt`
        # (anthropic/chromadb/streamlit/googleapiclient), never installed
        # by this job's own `requirements-api.txt`-only install step.
        # `.circleci/config.yml`'s own real, already-working job list
        # confirms this exact same exclusion is the established
        # precedent, not a new one invented here.
        run: pytest -q -rfE --maxfail=20 --ignore=sdks/python/tests/test_client.py --ignore=tests/test_agent.py --ignore=tests/test_injection_test_set.py --ignore=tests/test_integrations.py --ignore=tests/test_regression.py --ignore=tests/test_voice.py --ignore=tests_pipeline/test_retrieval.py

  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-api.txt -r requirements-optional.txt

      # Narrow exception: PYSEC-2026-2447 (CVE-2025-69872, unsafe pickle in diskcache). There is no fixed release (5.6.3 is the last one
      # and the advisory covers it). diskcache is not a direct dependency: dspy (requirements-optional.txt, used only by
      # api/services/prompt_optimization.py) pulls it in for its on-disk LLM cache, and exploiting it needs write access to that cache
      # directory. Remove this flag when diskcache ships a fix or dspy goes away (tests/test_ci_pip_audit_exception.py guards this).
      - name: pip-audit
        run: pip-audit -r requirements-api.txt -r requirements-optional.txt --desc off --ignore-vuln PYSEC-2026-2447

  build-backend:
    # Phase 5, Étape 10 -- real Docker build verification (P0, carried
    # over from Étapes 7/9: local builds in this session's own dev
    # environment kept failing on unrelated packages each time --
    # bcrypt, then torch, then ddtrace, then a bare ReadTimeoutError on
    # the very first dependency -- with every "missing" package
    # independently confirmed to exist and install fine locally,
    # pointing at local network instability, not a real code defect. A
    # GitHub-hosted runner is a genuinely different, stable network path
    # this session's own environment can't rule out or confirm from the
    # inside.
    #
    # Deliberately NOT `needs: backend-tests` -- a real, environment-
    # specific test-suite issue (auth/session tests failing only on this
    # runner, not locally, likely a missing real Redis reachable at
    # RATE_LIMIT_REDIS_URL for this job -- see ROADMAP.md) is a genuinely
    # separate concern from "does this Dockerfile actually build,"
    # which this job exists specifically to verify without being
    # blocked by an unrelated, already-traced issue.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: rag-saas-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    needs: frontend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: rag-saas-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate route types
        # Real bug found on this étape's own first real CI run (Phase 5,
        # Étape 10): `app/layout.tsx` uses Next.js's own typed-routes
        # `LayoutProps<"/">` global type, which only exists once Next.js
        # has actually generated it (normally a side effect of `next
        # dev`/`next build`, which a real local dev machine has usually
        # already run at least once -- a fresh CI checkout never has).
        # `next typegen` generates just that, without a full build.
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: npm audit
        run: npm audit --production

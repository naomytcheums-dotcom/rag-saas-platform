name: Tests and retrieval regression check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # RAG pipeline regression check -- pre-existing, unrelated to api/.
  # Currently broken independent of anything in this workflow's other
  # jobs: requirements.txt's own `agentfixture` line is a private
  # package with no published distribution (see that line's own
  # comment), so `pip install -r requirements.txt` can never succeed in
  # a fresh environment until it's actually published or the pin is
  # relaxed -- a real, separate fix, out of scope here.
  #
  # continue-on-error: true so this job's failure never flips the
  # OVERALL workflow run to "failure" (which GitHub does the instant any
  # one job fails, regardless of whether the others actually ran) --
  # api-tests/security-scan/docker-build already run independently
  # either way (no `needs:` ties them to this job), this only fixes the
  # misleading all-red badge at the workflow level.
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (ingestion + retrieval pure functions)
        run: pytest tests/test_ingestion.py tests/test_retrieval.py -v

      - name: Rebuild chunks and vector store from committed data/processed/fastapi_docs.json
        run: python src/indexing.py

      - name: Run regression check against results/regression_baseline.json
        run: python tests/test_regression.py

  # api/ (Partie 1.1 -- multi-tenant auth backend) -- previously had NO
  # automated coverage in CI at all; only the RAG pipeline job above ran
  # on push. Real Postgres/Redis/MinIO service containers, not mocks or
  # SQLite-only, so the same Postgres-specific behavior (CASCADE, real
  # constraint enforcement) the local dev workflow already tests against
  # is what CI verifies too -- see docs/AUTH_BACKEND_SETUP.md's "Tests"
  # section for the same fast/integration split run locally.
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_saas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only values -- never real secrets, this is a throwaway
      # Postgres/Redis/MinIO stack that only exists for this job's
      # duration. Real deployments get every one of these from an actual
      # secret store; see .env.example.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/rag_saas_test
      JWT_SECRET_KEY: ci-only-jwt-secret-key-never-used-outside-ci-32c
      SESSION_MIDDLEWARE_SECRET: ci-only-session-secret-never-used-outside-ci-32c
      AUDIT_LOG_HMAC_SECRET_KEY: ci-only-audit-log-hmac-key-never-used-outside-ci-32c
      SUPPORT_EMAIL: support@ci-test.invalid
      RESEND_API_KEY: re_ci_placeholder_never_a_real_key
      EMAIL_FROM_ADDRESS: onboarding@resend.dev
      COOKIE_SECURE: "False"
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      RATE_LIMIT_REDIS_URL: redis://localhost:6379/2
      RATE_LIMIT_ENABLED: "True"
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET_NAME: avatars
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      S3_PUBLIC_BASE_URL: http://localhost:9000/public/avatars
      # Partie 2.1.1 -- a SEPARATE bucket from avatars above, created
      # WITHOUT a public-read policy below (documents are private).
      S3_DOCUMENTS_BUCKET_NAME: documents
      # Dummy but non-empty: api/routers/oauth.py only registers a
      # provider with Authlib when both of its ID/SECRET env vars are
      # set (see that file's `if settings.GOOGLE_OAUTH_CLIENT_ID and
      # ...`) -- test_oauth_authorize_redirects_to_the_real_provider_consent_screen
      # needs that registration to exist so GET /auth/oauth/google/authorize
      # returns a real 302 instead of 503, even though it never sends
      # this value to Google (building the redirect URL only needs the
      # client to be registered, not a client secret Google would
      # actually accept -- this failed in CI without these set even
      # though it passed locally, where a real .env already had them).
      GOOGLE_OAUTH_CLIENT_ID: ci-only-google-client-id-never-real
      GOOGLE_OAUTH_CLIENT_SECRET: ci-only-google-client-secret-never-real
      GITHUB_OAUTH_CLIENT_ID: ci-only-github-client-id-never-real
      GITHUB_OAUTH_CLIENT_SECRET: ci-only-github-client-secret-never-real
      # Audit Categorie 4, items 27/28 -- encrypts JWTSigningKey/
      # EnterpriseSSOConnection secrets at rest (api/security/secret_encryption.py).
      # A real, freshly-generated Fernet key, thrown away with the rest of
      # this job's ephemeral state.
      SECRET_ENCRYPTION_KEY: t9aZv8_TY9hGq8Q0yZMkBjYAah-UwN1M6cDVkimg9AY=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install api/ dependencies (only requirements-api.txt -- api/ has no import dependency on the RAG pipeline's requirements.txt, see api/config.py's docstring, and that file additionally pulls in a private unpublished package this job doesn't need to resolve)
        run: pip install -r requirements-api.txt

      - name: Start MinIO (S3-compatible object storage for the avatar-upload tests, 1.1.13 -- so CI needs no real cloud credentials as a secret; boto3 talks to it identically, see api/services/storage.py's docstring)
        run: |
          # A plain `docker run` step, not a services: container -- the
          # official minio/minio image needs its CMD overridden
          # (`server /data`) to actually start the server instead of
          # printing usage and exiting, and GitHub Actions' services:
          # schema has no field to override a container's command.
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Create the avatars bucket and make it public-read
        run: |
          python - <<'PYEOF'
          import boto3
          client = boto3.client(
              "s3", endpoint_url="http://localhost:9000",
              aws_access_key_id="minioadmin", aws_secret_access_key="minioadmin",
              region_name="us-east-1",
          )
          client.create_bucket(Bucket="avatars")
          client.put_bucket_policy(Bucket="avatars", Policy="""{
              "Version": "2012-10-17",
              "Statement": [{"Effect": "Allow", "Principal": "*", "Action": "s3:GetObject", "Resource": "arn:aws:s3:::avatars/*"}]
          }""")
          # Partie 2.1.1 -- deliberately NO put_bucket_policy call here:
          # documents must stay private, unlike avatars above.
          client.create_bucket(Bucket="documents")
          PYEOF

      - name: Run Alembic migrations against the fresh Postgres service container
        run: python -m alembic upgrade head

      - name: Start a live Celery worker in the background (needed by tests/test_e2e_lifecycle.py's real declencheur -> Redis -> worker -> task chain)
        run: |
          nohup python -m celery -A api.tasks.celery_app worker --loglevel=info > celery-worker.log 2>&1 &
          sleep 5

      - name: Run the full api/ test suite with coverage
        run: >
          pytest
          tests/test_auth_api.py tests/test_auth_security.py tests/test_config.py
          tests/test_email_service.py tests/test_recovery_codes.py tests/test_password_strength.py
          tests/test_password_similarity.py tests/test_storage.py tests/test_audit_log.py tests/test_security_alerts.py
          tests/test_monitoring.py tests/test_trusted_ips_and_geoip.py tests/test_roles_and_permissions.py
          tests/test_organizations.py tests/test_organization_members.py tests/test_workspaces.py tests/test_resource_permissions.py tests/test_teams.py tests/test_invitations.py tests/test_quotas.py tests/test_user_limits.py tests/test_usage.py tests/test_organization_settings.py tests/test_organization_branding.py tests/test_custom_domains.py tests/test_ssl_certificates.py tests/test_domain_verification.py tests/test_email_domains.py tests/test_white_label.py tests/test_pdf_extraction.py tests/test_docx_extraction.py tests/test_txt_extraction.py tests/test_markdown_extraction.py tests/test_html_extraction.py tests/test_csv_extraction.py tests/test_json_extraction.py tests/test_xml_extraction.py tests/test_epub_extraction.py tests/test_url_fetching.py tests/test_url_extraction.py tests/test_sitemap_extraction.py tests/test_github_extraction.py tests/test_google_drive_extraction.py tests/test_notion_extraction.py tests/test_confluence_extraction.py tests/test_document_extraction.py tests/test_documents.py tests/test_google_docs_integration.py tests/test_notion_integration.py tests/test_confluence_integration.py
          tests/test_postgres_integration.py tests/test_rbac_integration.py tests/test_oauth_logic_integration.py
          tests/test_rate_limiting_integration.py tests/test_avatar_storage_integration.py tests/test_branding_storage_integration.py
          tests/test_dns_verification_integration.py tests/test_acme_integration.py tests/test_ssl_certificate_renewal_integration.py tests/test_domain_verification_integration.py tests/test_email_domains_integration.py tests/test_documents_integration.py tests/test_url_fetching_integration.py tests/test_sitemap_extraction_integration.py tests/test_sitemap_integration.py tests/test_github_extraction_integration.py tests/test_github_integration.py tests/test_google_drive_extraction_integration.py tests/test_google_drive_integration.py tests/test_notion_extraction_integration.py
          tests/test_geo_adaptive_rate_limit_integration.py tests/test_webauthn_integration.py
          tests/test_jwt_key_rotation_integration.py tests/test_enterprise_sso_integration.py
          tests/test_celery_integration.py tests/test_e2e_lifecycle.py
          --cov=api --cov-report=term-missing --cov-report=xml
          --cov-fail-under=75
          -v

      - name: Show the Celery worker's log if anything failed
        if: failure()
        run: cat celery-worker.log || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-report
          path: coverage.xml

  # Static (Snyk) and dynamic (OWASP ZAP baseline) security scanning of
  # api/. Both are best-effort in CI: Snyk needs a SNYK_TOKEN repo secret
  # this workflow can't create for you (Settings -> Secrets and
  # variables -> Actions -> New repository secret, a free snyk.io
  # account's token) -- without it, that step fails cleanly and
  # continue-on-error keeps the rest of the job running rather than
  # blocking every push on a secret nobody's added yet.
  security-scan:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_saas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/rag_saas_test
      JWT_SECRET_KEY: ci-only-jwt-secret-key-never-used-outside-ci-32c
      SESSION_MIDDLEWARE_SECRET: ci-only-session-secret-never-used-outside-ci-32c
      AUDIT_LOG_HMAC_SECRET_KEY: ci-only-audit-log-hmac-key-never-used-outside-ci-32c
      SUPPORT_EMAIL: support@ci-test.invalid
      RESEND_API_KEY: re_ci_placeholder_never_a_real_key
      EMAIL_FROM_ADDRESS: onboarding@resend.dev
      COOKIE_SECURE: "False"
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      RATE_LIMIT_REDIS_URL: redis://localhost:6379/2
      RATE_LIMIT_ENABLED: "True"
      SECRET_ENCRYPTION_KEY: t9aZv8_TY9hGq8Q0yZMkBjYAah-UwN1M6cDVkimg9AY=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install api/ dependencies
        run: pip install -r requirements-api.txt

      - name: Snyk -- dependency vulnerability scan of requirements-api.txt
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=requirements-api.txt --severity-threshold=high

      - name: Run Alembic migrations
        run: python -m alembic upgrade head

      - name: Start the API server for the dynamic scan
        run: |
          nohup uvicorn api.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done

      - name: OWASP ZAP API scan against the live instance
        # zap-api-scan.py (not the baseline/spider scan) is the ZAP mode
        # actually built for this: it imports an OpenAPI/GraphQL/SOAP
        # definition and drives every real operation it declares. A
        # baseline scan spiders for links to follow, which finds almost
        # nothing on a JSON API with no HTML pages to crawl -- exactly
        # the mistake an earlier version of this workflow made (an
        # invalid `-O` flag on zap-baseline.py, since that flag only
        # exists on zap-api-scan.py).
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: "http://localhost:8000/openapi.json"
          format: openapi
          fail_action: false
          # Otherwise the action tries to file a GitHub issue for any
          # alert found (real finding this run: Cross-Origin-Resource-
          # Policy header missing -- api/main.py's security-headers
          # middleware doesn't set it) and that POST 403s: this
          # workflow's default GITHUB_TOKEN has no issues:write
          # permission, and granting it just for this would be a bigger
          # change than a security-scan job should make on its own.
          # The findings are still visible in the job's own log output
          # and the uploaded artifact_name report below either way.
          allow_issue_writing: false

      - name: Show the API server's log if anything failed
        if: failure()
        run: cat uvicorn.log || true

  # Snyk audit finding: the Dockerfile went multi-stage + non-root to
  # fix its High/Medium findings (see the Dockerfile's own top comment).
  # No local Docker was available to prove that change didn't break the
  # image, so this actually builds it for real and smoke-tests the
  # running container -- the only meaningful "test" a Dockerfile has.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk space before building
        # This job was hitting "No space left on device" mid-build (see
        # requirements.txt's own comment on the actual root cause -- an
        # unpinned transitive torch dep pulling GB of unused CUDA
        # packages, now fixed). Kept as a safety margin so the next
        # heavy dependency doesn't reopen the same failure: these
        # preinstalled toolchains (.NET, Android SDK, GHC) are never
        # used by this Python/Streamlit project, and any Docker images
        # already cached on the runner image aren't needed for a build
        # starting from a clean `docker build`.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af --volumes
          df -h /

      - name: Build the image
        run: docker build -t rag-saas-platform:ci .

      - name: Confirm the container runs as a non-root user
        run: |
          user=$(docker run --rm rag-saas-platform:ci id -un)
          echo "Container runs as: $user"
          if [ "$user" = "root" ]; then
            echo "::error::Container is running as root -- the whole point of the Dockerfile's USER directive"
            exit 1
          fi

      - name: Start the container and wait for Streamlit's health endpoint
        run: |
          docker run -d --name app -p 8501:8501 rag-saas-platform:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health; then
              echo "Streamlit is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Streamlit never became healthy"
          docker logs app
          exit 1

      - name: Show container logs if anything failed
        if: failure()
        run: docker logs app || true

      - name: Stop the container
        if: always()
        run: docker stop app || true

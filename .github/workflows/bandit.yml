name: Bandit (non-blocking)

on:
  push:
  pull_request:

jobs:
  bandit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: python -m pip install --upgrade pip && pip install bandit[toml]

      - name: Run Bandit
        run: bandit -r api -c pyproject.toml

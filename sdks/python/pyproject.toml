[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-saas-sdk"
version = "0.1.0"
description = "Official Python SDK for the RAG SaaS Platform public API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["rag_saas_sdk*"]

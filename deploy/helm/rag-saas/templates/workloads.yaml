apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-api }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-api }
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: {{ .Values.existingSecret }} } }]
          env:
            {{- range $k, $v := .Values.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          readinessProbe: { httpGet: { path: /health/ready, port: 8000 }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 40, periodSeconds: 20 }
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector: { app: {{ .Release.Name }}-api }
  ports: [{ port: 80, targetPort: 8000 }]
{{- if .Values.worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-worker }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-worker }
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["celery", "-A", "api.tasks.celery_app", "worker", "--loglevel=info"]
          envFrom: [{ secretRef: { name: {{ .Values.existingSecret }} } }]
          resources: {{ toYaml .Values.worker.resources | nindent 12 }}
{{- end }}
{{- if .Values.beat.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-beat
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: {{ .Release.Name }}-beat }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-beat }
    spec:
      containers:
        - name: beat
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["celery", "-A", "api.tasks.celery_app", "beat", "--loglevel=info"]
          envFrom: [{ secretRef: { name: {{ .Values.existingSecret }} } }]
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-api
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  tls: [{ hosts: [{{ .Values.ingress.host }}], secretName: {{ .Values.ingress.tlsSecretName }} }]
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-api, port: { number: 80 } } } }]
{{- end }}

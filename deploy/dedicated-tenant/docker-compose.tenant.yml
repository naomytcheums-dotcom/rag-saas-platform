# One isolated stack per customer (spec 10.4.7 "dedicated tenant" and 10.4.8 "dedicated database"): its own API, worker, beat, PostgreSQL (pgvector) and Redis,
# on its own network and volumes, no port of the database or of Redis published. The same file serves the private / on-premise / VPC profiles
# (10.4.9 - 10.4.11): see docs/deployment/PRIVATE_ONPREM_VPC.md. Provision with:  TENANT=acme ./provision.sh
# Executed locally (docker compose up, migrations, health checks, isolation between two tenants): tests/test_deploy_dedicated_tenant_e2e.py.
name: rag-saas-${TENANT:?set TENANT}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragsaas
      POSTGRES_USER: ragsaas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ragsaas -d ragsaas"], interval: 5s, timeout: 5s, retries: 20 }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped

  api:
    build: { context: ../.., dockerfile: Dockerfile.api }
    image: ${IMAGE:-rag-saas-api:dedicated}
    environment: &env
      DATABASE_URL: postgresql+asyncpg://ragsaas:${DB_PASSWORD}@db:5432/ragsaas
      # single-label host names (db, redis) are private networks for the "public Redis needs TLS" startup rule
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RATE_LIMIT_REDIS_URL: redis://redis:6379/2
      CACHE_REDIS_URL: redis://redis:6379/3
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      SESSION_MIDDLEWARE_SECRET: ${SESSION_MIDDLEWARE_SECRET:?set SESSION_MIDDLEWARE_SECRET}
      AUDIT_LOG_HMAC_SECRET_KEY: ${AUDIT_LOG_HMAC_SECRET_KEY:?set AUDIT_LOG_HMAC_SECRET_KEY}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?set ENCRYPTION_MASTER_KEY}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:?set SUPPORT_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CREDITS_ALLOW_UNPAID_TOPUP: "false"
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  worker:
    image: ${IMAGE:-rag-saas-api:dedicated}
    command: celery -A api.tasks.celery_app worker --loglevel=info
    environment: *env
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped

  beat:
    image: ${IMAGE:-rag-saas-api:dedicated}
    command: celery -A api.tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment: *env
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped

volumes:
  dbdata: {}
  redisdata: {}

[tool.pytest.ini_options]
# Makes `api.*` importable from anywhere pytest is invoked from (repo root),
# without the sys.path-hacking every tests/test_*.py file does today to
# reach src/ -- api/ is a real package (has __init__.py), so this is the
# standard, non-hacky way to make it importable under test.
pythonpath = ["."]
asyncio_mode = "auto"
# One shared event loop for the whole test session, not one per test
# function. The integration test files (test_postgres_integration.py and
# friends) each open real asyncpg/S3/Celery connections from module-scoped
# fixtures; asyncpg connections are bound to the loop they were opened on,
# and pytest-asyncio's per-function default loop was tearing loops down
# between test files, leaving later files handed a closed loop (visible
# only when running multiple integration files in one `pytest` invocation
# -- each passed individually). A session-wide loop is a no-op for the
# fast SQLite unit tests (they don't hold cross-test state) and is what
# the integration fixtures were already implicitly assuming.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Phase 4, Étape 5ter -- real, minimal marker registry (avoids pytest's
# own "unknown marker" warning), one real entry: `network_flaky` tags a
# real test that hits a real, external, rate-limited third-party API
# (GitHub's own real, unauthenticated REST API -- 60 requests/hour per
# real IP) rather than a real, controlled local server -- a real,
# genuine "sometimes fails for reasons unrelated to this codebase" test,
# excluded from the default run (see `addopts` below) to keep CI/the
# standard suite deterministic. Run it explicitly with
# `pytest -m network_flaky ...` (or `pytest -m "" ...` to run
# everything, ignoring this default exclusion).
markers = [
    "network_flaky: hits a real, external, rate-limited third-party API -- excluded from the default run, run explicitly with -m network_flaky",
    # Phase 5, Étape 3 -- Paystack has never been exercised against its
    # real API in this session (no PAYSTACK_SECRET_KEY in any available
    # environment, see ROADMAP.md). Tests marked here are real, written,
    # and ready, but need a real Paystack sandbox key to actually run --
    # skipped by their own `pytest.mark.skipif` (not just excluded by
    # addopts, unlike network_flaky) so `pytest -m paystack_live` without
    # a key still reports them as skipped, not silently deselected.
    "paystack_live: needs a real PAYSTACK_SECRET_KEY (sandbox) to run -- see tests/test_billing_paystack_live.py",
]
addopts = "-m \"not network_flaky\""

[tool.coverage.run]
# Coverage measurement audit finding: SQLAlchemy's async extension uses
# greenlet internally to bridge asyncpg's sync-style DBAPI calls into
# async code -- every greenlet context switch is invisible to coverage's
# default sys.settrace-based tracer, so any line AFTER such a switch in
# the same function (most commonly right after `await db.commit()` /
# `await db.execute()`) gets misreported as "not covered" even when a
# passing test demonstrably executes it. Confirmed directly: isolating
# test_enabling_two_factor_sends_a_notification_email (which asserts an
# email was captured, only possible if the code past its `await
# db.commit()` ran) still showed those exact lines as "Missing" without
# this setting. coverage.py has supported this via the `greenlet`
# tracer since 7.x specifically for SQLAlchemy async's use case.
concurrency = ["greenlet"]

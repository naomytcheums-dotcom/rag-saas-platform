version: 2.1

# Real, free CI for this PRIVATE repo -- GitHub Actions is currently
# unusable here (account billing issue, unrelated to this repo's code:
# every job fails in ~2s with "recent account payments have failed or
# your spending limit needs to be increased"). CircleCI's free tier
# (6,000 build-minutes/month on Linux, no card required, works on
# private repos) replaces it. Deliberately mirrors
# .github/workflows/regression.yml's two most important jobs
# (the RAG pipeline regression check, and the real Postgres/Redis/MinIO
# -backed api/ auth-backend suite) rather than every job that file has --
# docker-build and the Snyk/OWASP ZAP security-scan job are lower
# priority (they scan/build, they don't verify correctness) and are
# left for a later pass; see docs/ci/CIRCLECI_SETUP.md.

jobs:
  rag-pipeline-regression:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install dependencies (requirements.txt, minus the unpublished agentfixture private package -- same filter as regression.yml)
          command: grep -v '^agentfixture$' requirements.txt > requirements-runtime.txt && pip install -r requirements-runtime.txt
      - run:
          name: Run unit tests (ingestion + retrieval pure functions)
          command: pytest tests_pipeline/test_ingestion.py tests_pipeline/test_retrieval.py -v
      - run:
          name: Rebuild chunks and vector store from committed data/processed/fastapi_docs.json
          command: python src/indexing.py
      - run:
          name: Run regression check against results/regression_baseline.json
          command: python tests/test_regression.py

  api-tests:
    # Default "medium" (2 vCPU / 4GB RAM) is shared across the primary
    # container AND the postgres/redis/minio service containers below --
    # confirmed too small via a real run (2026-09-15): the job was
    # killed (OOM) at 94% while loading a real YOLO model, after
    # thousands of prior tests (many loading sentence-transformers,
    # CLIP, cross-encoder models) had already accumulated memory in the
    # same long-lived process. "large" doubles both CPU and RAM.
    # xlarge is NOT available on this project's CircleCI plan (run 606 of 2026-10-12: "resource-class-not-in-plan", the job never started). Back to
    # large (8 GB): run 599 had the MinIO service container OOM-killed in one of four containers while each container ran ONE long pytest process;
    # the chunks of 10 files below (one pytest process per chunk) are the memory fix, large + chunks was not measured before this commit.
    resource_class: large
    parallelism: 4
    docker:
      - image: cimg/python:3.13
      # Migration 0128 runs CREATE EXTENSION vector (pgvector HNSW embeddings): cimg/postgres does not ship the
      # extension, so `alembic upgrade head` failed right after MinIO started. Same PostgreSQL major, with pgvector.
      - image: pgvector/pgvector:pg16
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_saas_test
      - image: cimg/redis:7.4
      # MinIO no longer publishes a pullable community image: Docker Hub's minio/minio and
      # quay.io/minio/minio both answer "unauthorized" to anonymous pulls (that is what made this job
      # fail at "Spin up environment" before any test ran). bitnamilegacy/minio is still public and
      # speaks the same S3 API on port 9000; the root user/password below match S3_ACCESS_KEY_ID /
      # S3_SECRET_ACCESS_KEY, throwaway CI-only values.
      - image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        environment:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
    environment:
      # CI-only values -- never real secrets, this is a throwaway
      # Postgres/Redis/MinIO stack that only exists for this job's
      # duration. Real deployments get every one of these from an
      # actual secret store; see .env.example. Identical to
      # regression.yml's api-tests job, so behavior stays comparable
      # between the two CI providers.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/rag_saas_test
      JWT_SECRET_KEY: ci-only-jwt-secret-key-never-used-outside-ci-32c
      SESSION_MIDDLEWARE_SECRET: ci-only-session-secret-never-used-outside-ci-32c
      AUDIT_LOG_HMAC_SECRET_KEY: ci-only-audit-log-hmac-key-never-used-outside-ci-32c
      # Partie 10.3's real AES-256-GCM field encryption (webhook secrets,
      # among others) raises EncryptionNotConfiguredError without this --
      # confirmed as the real cause of all 9 tests/test_webhooks.py
      # failures in a 2026-09-15 run, a config gap from before this key
      # existed, not a code or test bug. Generated with the project's own
      # api.security.encryption.generate_encryption_key() -- a throwaway
      # CI-only key, never used outside this job.
      ENCRYPTION_MASTER_KEY: gBZ-pfccwD20XSBiesnRCAo9e7_y7E0LOAAvsXGJXyg=
      SUPPORT_EMAIL: support@ci-test.invalid
      RESEND_API_KEY: re_ci_placeholder_never_a_real_key
      EMAIL_FROM_ADDRESS: onboarding@resend.dev
      COOKIE_SECURE: "False"
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      RATE_LIMIT_REDIS_URL: redis://localhost:6379/2
      RATE_LIMIT_ENABLED: "True"
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET_NAME: avatars
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      S3_PUBLIC_BASE_URL: http://localhost:9000/public/avatars
      S3_DOCUMENTS_BUCKET_NAME: documents
      S3_VOICE_BUCKET_NAME: voice
      GOOGLE_OAUTH_CLIENT_ID: ci-only-google-client-id-never-real
      GOOGLE_OAUTH_CLIENT_SECRET: ci-only-google-client-secret-never-real
      GITHUB_OAUTH_CLIENT_ID: ci-only-github-client-id-never-real
      GITHUB_OAUTH_CLIENT_SECRET: ci-only-github-client-secret-never-real
      SECRET_ENCRYPTION_KEY: t9aZv8_TY9hGq8Q0yZMkBjYAah-UwN1M6cDVkimg9AY=
    steps:
      - checkout
      - run:
          name: Wait for Postgres
          command: |
            for i in $(seq 1 30); do
              pg_isready -h localhost -p 5432 -U postgres && break
              sleep 1
            done
      - run:
          name: Wait for Redis
          command: |
            sudo apt-get update && sudo apt-get install -y redis-tools
            for i in $(seq 1 30); do
              redis-cli -h localhost ping && break
              sleep 1
            done
      - run:
          name: Wait for MinIO
          command: |
            for i in $(seq 1 30); do
              curl -sf http://localhost:9000/minio/health/live && break
              sleep 1
            done
      - run:
          name: Install api/ dependencies
          command: pip install -r requirements-api.txt -r requirements-optional.txt
      - run:
          name: Install real Tesseract OCR + poppler (Partie 3.1.6) and Pango/cairo for WeasyPrint (Partie 8.1.14)
          command: |
            sudo apt-get install -y tesseract-ocr tesseract-ocr-fra poppler-utils \
              libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libcairo2 libffi-dev shared-mime-info
      - run:
          name: Install Node.js (Partie 16 ter -- api/security/plugin_sandbox.py runs .js plugins via a real `node` subprocess; tests/test_plugin_sandbox.py needs it installed, not mocked)
          command: |
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
      - run:
          name: Create the avatars/documents/voice buckets (avatars public-read, the other two stay private)
          # A literal `<<` heredoc here is a real, reserved CircleCI 2.1
          # YAML token (merge key) -- "Unclosed '<<' tag" pipeline
          # failure, found via a real CircleCI run. Fixed by moving the
          # script into a real repo file instead of escaping the
          # heredoc, avoiding this whole class of bug rather than
          # working around it.
          command: python scripts/ci_create_buckets.py
      - run:
          name: Run Alembic migrations against the fresh Postgres container
          command: python -m alembic upgrade head
      - run:
          name: Start a live Celery worker in the background (needed by tests/test_e2e_lifecycle.py's real trigger -> Redis -> worker -> task chain)
          command: |
            nohup python -m celery -A api.tasks.celery_app worker --loglevel=info > celery-worker.log 2>&1 &
            sleep 5
          background: true
      - run:
          name: Run the api/ test suite (split across the parallel containers)
          command: |
            # 2026-10-11: the suite (6,300+ tests) no longer fits the one-hour job limit when run as four hand-listed batches in ONE container
            # ("Build timed out" at 1h 0m, and an earlier "exit code 137"). It is now split by file size over `parallelism` containers; each
            # container has its own PostgreSQL / Redis / MinIO / Celery worker (service containers are per parallel container) and its own
            # process, so memory is still released between runs. A new test file is picked up automatically (the old hand-written lists
            # silently skipped every file nobody had added). Excluded as before: legacy `src/` tests that import the private `agentfixture`
            # package, tests/test_regression.py (legacy gate, run by the rag-pipeline-regression job), and the browser-only voice test. The 75 % coverage gate cannot be computed per container: the combined report is
            # produced by the GitHub `backend-tests` job; here coverage.xml is stored per container as an artifact.
            FILES=$(circleci tests glob "tests/**/test_*.py" | grep -v -E '^tests/test_(agent|agent_evaluation|injection_test_set|integrations|voice|regression)\.py$' | circleci tests split --split-by=filesize)
            echo "files in this container: $(echo $FILES | wc -w)"
            # Run this container's files in chunks of 10, one pytest process per chunk (run 596 of 2026-10-11: a single process per container let model memory
            # pile up until the kernel killed the MinIO service container, and every S3 test after that failed with "Could not connect to localhost:9000").
            printf '%s\n' $FILES | split -l 10 - /tmp/chunk_
            set +e
            RC=0
            for chunk in /tmp/chunk_*; do
              echo "--- $(basename $chunk): $(wc -l < $chunk) files ---"
              pytest -p no:cacheprovider -q -rfE --cov=api --cov-append --cov-report=xml:coverage.xml $(cat $chunk)
              CODE=$?
              if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 5 ]; then RC=1; fi
            done
            exit $RC
      - run:
          name: Show the Celery worker's log if anything failed
          command: cat celery-worker.log || true
          when: on_fail
      - store_artifacts:
          path: coverage.xml
          destination: api-coverage-report

workflows:
  regression-check:
    jobs:
      # The four large containers of api-tests are expensive: dependency-bot branches are covered by GitHub's own checks and are not built here.
      - rag-pipeline-regression:
          filters:
            branches:
              ignore: /dependabot\/.*/
      - api-tests:
          filters:
            branches:
              ignore: /dependabot\/.*/
